<!DOCTYPE html>
<html>
<head>

https://cdn.jsdelivr.net/npm/chart.jsscript>
 
<style>
body{
font-family:Arial;
padding:20px;
}
</style>
 
</head>
 
<body>
 
<h1>Teste Chart.js</h1>
 
<canvas id="grafico"></canvas>
 
<script>
 
const ctx = document.getElementById('grafico');
 
new Chart(ctx,{
type:'bar',
data:{

datasets:[{

data:[10,20,30,40],
backgroundColor:'blue'
}]
}
});
 
</script>
 
</body>
